  intro: MEng Student in Computer Technology (Electronic Information) at the Institute of Computing Technology,
    Chinese Academy of Sciences. I received my B.Eng. in Microelectronics Science and Engineering from Jiangnan
    University. My research interests include GPU/NPU architecture, networks on chip, electronic system-level (ESL)
