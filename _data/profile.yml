  education:
    - title: 中国科学院计算技术研究所
      meta: 计算机技术 · 专业型硕士 · 推荐免试
      date: 2026.09 — 2029.06（预计）
      bullets:
        - 研究兴趣：SIMT / GPU 体系结构、片上互连网络、FPGA 原型验证。
    - title: 江南大学
      meta: 微电子科学与工程 · 工学学士
      date: 2022.09 — 2026.06
      bullets:
        - GPA 3.91 / 4.00，专业排名 1 / 144。
        - 本科毕业论文《面向开源脑启发处理器的片上互连网络（NoC）设计》，获评优秀毕业论文。
  research:
    - title: 面向开源 SIMT 处理器的片上互连网络设计
      meta: 中国科学院计算技术研究所 · 客座实习与本科毕业设计
      date: 2025.10 — 2026.06
      tags: [Chisel, NoC, GPGPU-Sim, ChiselTest, cocotb, FPGA]
      bullets:
        - 以 NVIDIA Volta V100 为架构参考，使用 Chisel 开发面向 GPGPU 的两级分层交叉开关 NoC，支持 SM 与 L2 缓存切片互联，适配“多对少对多”的访存流量模式。
        - 搭建 ChiselTest 与 cocotb 验证框架，将 NoC 集成至 GPGPU-Sim 开展周期级性能仿真，评估访存带宽与端到端延迟；基于 SMIC 28nm 工艺完成 Design Compiler 前端综合。
        - 基于 4 片 AMD VU19P FPGA 构建验证平台，通过 GTY 高速串行接口实现全交叉片间互联，单链路速率超过 10 Gb/s。
        - 获先进计算机系统研究中心 2025 年度“优秀客座学生”。
    - title: 专用高算力 AI 协处理器自动化设计工具
      meta: 省级大学生创新项目“芯驰智捷” · 结题优秀
      date: 2023.10 — 2025.05
      tags: [LLM, Verilog, TensorFlow, Gradio]
      bullets:
        - 融合国产开源大语言模型，探索从自然语言到定制 AI 协处理器 Verilog 代码的自动生成流程，参与模型部署与微调。
        - 基于 TensorFlow 2.0 构建神经网络架构；建立专有 AI 协处理器设计数据库，开发领域知识增强的提示工程框架，参与生成机制与验证引擎建设。
        - 参与协处理器移植，使用 Gradio 构建可视化交互界面，支持跨平台适配。
  publication:
    title: Towards FlagOS Backend and End-to-End Robotic Simulation on Neuromorphic Processor
    authors: Yili Wang, Juncheng Jin, Jian Hu, Xuemiao Liu, Di Zhao
    venue: MICRO 2026 OASIS-AI Workshop · 已录用 · 第三作者
    detail: 与第 59 届 IEEE/ACM International Symposium on Microarchitecture（MICRO 2026）同期举办；2026 年 11 月 1 日，希腊雅典。
    bullets:
      - 主要负责 OpenBPU 第三代 RISC-V SIMT 类脑处理器 Wenquxing 26 在 Xilinx Virtex UltraScale+ VU19P FPGA 上的硬件部署与原型验证。
      - 参与软硬件协同研究。项目面向 FlagOS / FlagTree 构建 Triton 编译后端，将 Triton Kernel 映射为 RV-SIMT 机器码，并通过周期精确仿真完成六自由度机械臂运动控制任务的端到端验证。
  projects:
    - title: RISC-V CPU 设计
      meta: 第九届全国大学生集成电路创新创业大赛“竞业达杯” · 全国总决赛一等奖
      date: 2025.03 — 2025.08
      tags: [RV32IMF, L1 Cache, JTAG, RT-Thread]
      bullets:
        - 项目实现支持 RV32IMF 的 RISC-V 处理器，包含冒险检测、前递与 L1 Data Cache，使用 riscv-tests 进行指令测试并实现 JTAG 调试。
        - 优化流水线暂停策略与冒险处理逻辑，设计 Block RAM 与寄存器组合存储架构，优化访存关键路径；部署 RT-Thread 并运行 CoreMark 测评。
    - title: 智能手语识别低功耗 SoC
      meta: 嵌入式芯片与系统设计竞赛 · FPGA 创新设计赛道“AMD 杯”全国二等奖
      date: 2024.09 — 2024.12
      tags: [Zynq-7020, YOLOv4-tiny, HLS, Vivado]
      bullets:
        - 基于 Zynq-7020 部署 YOLOv4-tiny 手语识别系统，数据集采用 VOC2007 格式，含 2.2 万样本，实现卷积、池化等 7 种算子硬件加速。
        - 负责神经网络算子实现与 FPGA 加速器部署，使用 Python 与 HLS 联合仿真；采用重叠式数据流、乒乓存储与计算流水线、16 位定点量化。
    - title: 基于脑电的高空作业安全检测
      meta: 嵌入式芯片与系统设计竞赛 · 芯片应用赛道“沁恒杯”东部赛区二等奖
      date: 2024.03 — 2024.08
      tags: [RISC-V, EEG, SVM, DMA, PyQt5]
      bullets:
        - 整合 TGAM 脑电模块、QMI8658 惯性传感器与温度传感器，在沁恒 RISC-V 开发板上构建多模态感知系统，连接 PC、手机 APP 与板卡。
        - 负责 EEG 特征提取与算法部署，通过频域特征量化专注度和疲劳度，使用 SVM 实现跌落检测，并通过串口中断与 DMA 实现数据交互。
    - title: 单相逆变并网运行系统
      meta: 全国大学生电子设计竞赛 · 江苏赛区二等奖
      date: 2023.07 — 2023.08
      tags: [STM32F103, PID, SPWM]
      bullets:
        - 负责 STM32F103 开发、PID 算法设计与并网策略实现，通过相位跟踪、SPWM 与 H 桥控制实现逆变器并联运行。
    - title: 历史建筑楼梯磨损多维度分析框架
      meta: 美国大学生数学建模竞赛 · Honorable Mention（H 奖）
      date: 2025.02 — 2025.05
      tags: [FEM, Bayesian Inference, Monte Carlo, HMM]
      bullets:
        - "论文《Echoes of Footsteps: Guiding Archaeological Analysis Through Stair Wear Modeling》融合磨损理论、有限元、贝叶斯推理、蒙特卡洛模拟、HMM 与计算机视觉。"
        - 负责抽象建立楼梯磨损、行人流动模式及基于磨损的年代估计三个子模型。
  practice:
    - title: 第十届全国大学生集成电路创新创业大赛 · 算能企业命题技术助理
      meta: 面向多元场景与具身智能的 TPU 云边端协同创新系统设计
