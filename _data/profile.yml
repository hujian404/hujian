  - title: Polaris-ECOS：开源脑启发处理器 RTL 到 GDS 实现与验证
    meta: '中国科学院大学《集成电路设计与验证》课程设计 · 基于 ECOS 开源 EDA 团队工具链 · <a href="https://github.com/hujian404/Polaris-ECOS">开源仓库</a>'
    date: 2026 年秋季
    tags:
    - RISC-V
    - Chisel / Verilog
    - ECOS / ICS55
    - CTS / STA
    - C++
    bullets:
    - '基于开源脑启发处理器二代 <a href="https://gitee.com/OpenBPU/OpenBPU2">OpenBPU2（Gitee）</a> / <a href="https://github.com/ByeBeihai/Polaris">Polaris（GitHub）</a>，完成无缓存 RV64 配置适配、程序级 RTL/门级对照及开源 ECOS 工具链上的综合、布局布线与 GDS 导出；定位 onehot 优化导致的握手逻辑差异并构造 SAT 最小复现。'
    - 通过拥塞驱动布局、密度调整及两缓冲器 ECO，实现 DRC/LVS 零违例、布线后 LEC 通过；50 MHz 下十三个 RC/PVT 角 setup/hold 均通过，最差裕量分别为 +0.256 ns / +0.005 ns，芯片面积约 5.623 mm²。
    - 集成九个 ECOS SRAM 硬宏，完成接口与程序验证、布局、覆盖约 59 万端点的完整时钟树构建及合法化，并推进至布线阶段。受大规模设计下开源工具的拥塞修复效率及六小时运行预算限制，本轮实验未生成该配置的最终 GDS；已保留流程配置与阶段检查点，为后续时钟优化、布线收敛及版图导出提供工程基础。
    - '<a href="https://github.com/openecos-projects/ecc-tools/pull/319">ecc-tools PR #319</a>：修复 CTS 源端主干插入缓冲后根输入引脚残留于原网络的问题，恢复引脚/网络归属一致性；九宏用例 CTS 通过，偏斜 0.057312 ns，满足 0.08 ns 目标。已合并至上游主分支。'
    - '<a href="https://github.com/openecos-projects/ecc-tools/pull/320">ecc-tools PR #320</a>：将局部负载恢复中的全局引脚电容表复制改为局部子集构建，复制工作量由 O(GN) 降至 O(Σn_g)，保持电气检查语义；新增三项回归用例，23/23 iCTS 原生测试通过。已合并至上游主分支。'
