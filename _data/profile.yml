    authors: Yili Wang, Juncheng Jin, Jian Hu, Xuemiao Liu, Di Zhao
    venue: MICRO 2026 OASIS-AI Workshop · Accepted · Third author
    detail: Held with the 59th IEEE/ACM International Symposium on Microarchitecture (MICRO 2026), Athens, Greece,
