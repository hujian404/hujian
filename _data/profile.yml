    bullets:
    - Primarily responsible for hardware deployment and prototype validation of Wenquxing 26, the third-generation
      OpenBPU RISC-V brain-inspired processor, on the Xilinx Virtex UltraScale+ VU19P FPGA.
    - Participated in hardware–software co-design research. The project develops a Triton backend for FlagOS / FlagTree,
      maps Triton kernels to target processor machine code, and validates end-to-end robotic-arm control through
      cycle-accurate simulation.
  projects:
  - title: NoC Design for an Open-Source Processor
    meta: Institute of Computing Technology, CAS · Visiting internship and undergraduate thesis
    date: Oct 2025 — Jun 2026
    tags:
    - Chisel
    - NoC
    - GPGPU-Sim
    - ChiselTest
    - cocotb
    - FPGA
    bullets:
    - Developed a hierarchical crossbar NoC in Chisel for GPGPU systems, connecting streaming multiprocessors and
      L2 cache slices to support GPU memory traffic.
    - Built ChiselTest and cocotb verification flows, integrated the NoC into GPGPU-Sim for cycle-level simulation,
      and completed front-end synthesis with Design Compiler.
    - Built an AMD VU19P FPGA validation platform with GTY serial links for inter-device communication and prototype
      verification.
    - Recognized as an Outstanding Visiting Student by the Research Center for Advanced Computer Systems.
  - title: 'Polaris-ECOS: RTL-to-GDS Implementation and Verification of a Neuromorphic Processor'
    meta: 'UCAS Integrated Circuit Design and Verification course project · Built with the ECOS open-source EDA team’s toolchain · <a href="https://github.com/hujian404/Polaris-ECOS">Open-source repository</a>'
    date: Fall 2026
    tags:
    - RISC-V
    - Chisel / Verilog
    - ECOS / ICS55
    - CTS / STA
    - C++
    bullets:
    - 'Adapted the second-generation open-source brain-inspired processor <a href="https://gitee.com/OpenBPU/OpenBPU2">OpenBPU2 (Gitee)</a> / <a href="https://github.com/ByeBeihai/Polaris">Polaris (GitHub)</a> into a cacheless RV64 configuration for the ECOS flow, from synthesis and place-and-route to GDS export, with RTL/gate-level program comparisons; isolated a onehot-induced handshake mismatch with a minimal SAT reproducer.'
    - Combined congestion-driven placement, density tuning, and a two-buffer ECO to achieve zero DRC/LVS violations and proven post-route LEC. All thirteen RC/PVT corners passed setup/hold at 50 MHz, with worst margins of +0.256 ns / +0.005 ns and a die area of approximately 5.623 mm².
    - Integrated nine ECOS SRAM macros and completed interface/program verification, placement, full clock-tree construction for approximately 589,000 endpoints, and legalization, progressing into routing. Congestion repair on the large design exceeded the six-hour runtime budget, preventing final GDS generation in this experiment. Preserved flow configurations and stage checkpoints provide a foundation for further clock optimization, routing convergence, and layout export.
    - '<a href="https://github.com/openecos-projects/ecc-tools/pull/319">ecc-tools PR #319</a>: Fixed stale source-net membership of a relocated root input after buffered CTS trunk reconnection. The nine-macro fixture completed CTS with 0.057312 ns skew against a 0.08 ns target. Merged into upstream main.'
    - '<a href="https://github.com/openecos-projects/ecc-tools/pull/320">ecc-tools PR #320</a>: Built local pin-capacitance subsets during load recovery instead of copying global tables, reducing copying work from O(GN) to O(Σn_g) while preserving electrical checks. Added three regression cases; all 23 native iCTS test targets passed. Merged into upstream main.'
