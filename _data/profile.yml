en:
  name: Jian Hu
  subtitle: Computer Architecture · Networks on Chip · RISC-V & FPGA
  intro: Master's student in Computer Technology at the Institute of Computing Technology, Chinese Academy of Sciences, with a B.Eng. in Microelectronics Science and Engineering from Jiangnan University. My interests include SIMT / GPU architecture, networks on chip, and FPGA prototyping, alongside AI compilation and hardware–software co-design.
  homepage: Home
  cv: CV
  blog_label: Technical blog
  contact: Contact
  print: Print / Save PDF
  nav: [Education, Research, Publication, Projects, Service, Honors & Skills]
  education:
    - title: Institute of Computing Technology, Chinese Academy of Sciences
      meta: Professional Master's in Computer Technology · Recommended admission without entrance examination
      date: Sep 2026 — Jun 2029 (expected)
      bullets:
        - Interests include SIMT / GPU architecture, networks on chip, and FPGA prototyping.
    - title: Jiangnan University
      meta: B.Eng. in Microelectronics Science and Engineering
      date: Sep 2022 — Jun 2026
      bullets:
        - GPA 3.91 / 4.00; ranked 1st out of 144 students.
        - Outstanding undergraduate thesis on NoC design for an open-source brain-inspired processor.
  research:
    - title: NoC Design for an Open-Source SIMT Processor
      meta: Institute of Computing Technology, CAS · Visiting internship and undergraduate thesis
      date: Oct 2025 — Jun 2026
      tags: [Chisel, NoC, GPGPU-Sim, ChiselTest, cocotb, FPGA]
      bullets:
        - Developed a two-level hierarchical crossbar NoC in Chisel for GPGPU systems, using NVIDIA Volta V100 as an architectural reference. Connected streaming multiprocessors and L2 cache slices for many-to-few-to-many memory traffic.
        - Built ChiselTest and cocotb verification flows, integrated the NoC into GPGPU-Sim for cycle-level bandwidth and latency evaluation, and completed Design Compiler synthesis with an SMIC 28nm process.
        - Built a four-device AMD VU19P FPGA validation platform with fully interconnected GTY serial links exceeding 10 Gb/s per link.
        - Recognized as an Outstanding Visiting Student for 2025 by the Research Center for Advanced Computer Systems.
    - title: Automated Design Tool for AI Coprocessors
      meta: Provincial Undergraduate Innovation Project · Completed with an excellent evaluation
      date: Oct 2023 — May 2025
      tags: [LLM, Verilog, TensorFlow, Gradio]
      bullets:
        - Contributed to deployment and fine-tuning of open-source Chinese LLMs for generating customized AI coprocessor Verilog from natural-language descriptions.
        - Built neural-network architectures in TensorFlow 2.0, assembled a domain-specific design database, developed knowledge-enhanced prompts, and contributed to generation and verification components.
        - Contributed to coprocessor porting and built a Gradio interface for interactive use and cross-platform adaptation.
  publication:
    title: Towards FlagOS Backend and End-to-End Robotic Simulation on Neuromorphic Processor
    authors: Yili Wang, Juncheng Jin, Jian Hu, Xuemiao Liu, Di Zhao
    venue: MICRO 2026 OASIS-AI Workshop · Accepted · Third author
    detail: Held with the 59th IEEE/ACM International Symposium on Microarchitecture (MICRO 2026), Athens, Greece, November 1, 2026.
    bullets:
      - Primarily responsible for hardware deployment and prototype validation of Wenquxing 26, the third-generation OpenBPU RISC-V SIMT brain-inspired processor, on the Xilinx Virtex UltraScale+ VU19P FPGA.
      - Participated in hardware–software co-design research. The project develops a Triton backend for FlagOS / FlagTree, maps Triton kernels to RV-SIMT machine code, and validates end-to-end six-degree-of-freedom robotic-arm control through cycle-accurate simulation.
  projects:
    - title: RISC-V CPU Design
      meta: 9th National Undergraduate IC Innovation and Entrepreneurship Competition · Jingyeda Cup · First Prize, National Finals
      date: Mar 2025 — Aug 2025
      tags: [RV32IMF, L1 Cache, JTAG, RT-Thread]
      bullets:
        - The project implemented an RV32IMF processor with hazard detection, forwarding, and an L1 data cache, validated with riscv-tests and JTAG debugging.
        - Optimized pipeline stalls and hazard handling, combined Block RAM and registers to improve the memory critical path, deployed RT-Thread, and ran CoreMark benchmarks.
    - title: Low-Power SoC for Sign-Language Recognition
      meta: Embedded Chip and System Design Competition · AMD Cup FPGA Track · Second Prize, National Finals
      date: Sep 2024 — Dec 2024
      tags: [Zynq-7020, YOLOv4-tiny, HLS, Vivado]
      bullets:
        - The project deployed YOLOv4-tiny on Zynq-7020 using a VOC2007-format dataset of 22,000 samples, accelerating seven operators including convolution and pooling.
        - Implemented neural-network operators and deployed the FPGA accelerator with Python / HLS co-simulation, overlapping dataflow, ping-pong buffering, pipelined computation, and 16-bit fixed-point quantization.
    - title: EEG-Based Safety Monitoring for Work at Height
      meta: Embedded Chip and System Design Competition · WCH Cup Chip Application Track · Second Prize, Eastern Region
      date: Mar 2024 — Aug 2024
      tags: [RISC-V, EEG, SVM, DMA, PyQt5]
      bullets:
        - Combined a TGAM EEG module, QMI8658 inertial sensor, and temperature sensor on a WCH RISC-V development board, connecting the board with a PC interface and mobile app.
        - Extracted EEG frequency-domain features to quantify attention and fatigue, deployed SVM-based fall detection, and implemented serial-interrupt and DMA data transfer.
    - title: Parallel Single-Phase Inverter System
      meta: National Undergraduate Electronics Design Contest · Second Prize, Jiangsu Region
      date: Jul 2023 — Aug 2023
      tags: [STM32F103, PID, SPWM]
      bullets:
        - Developed STM32F103 firmware, PID control, and synchronization strategies, using phase tracking, SPWM, and H-bridge control for parallel inverter operation.
    - title: Stair-Wear Analysis for Historical Buildings
      meta: Mathematical Contest in Modeling · Honorable Mention
      date: Feb 2025 — May 2025
      tags: [FEM, Bayesian Inference, Monte Carlo, HMM]
      bullets:
        - The paper, Echoes of Footsteps Guiding Archaeological Analysis Through Stair Wear Modeling, combined wear theory, finite elements, Bayesian inference, Monte Carlo simulation, hidden Markov models, and computer vision.
        - Developed three submodels covering stair wear, pedestrian flow patterns, and wear-based age estimation.
  practice:
    - title: Technical Assistant for the SOPHON Challenge
      meta: 10th National Undergraduate IC Innovation and Entrepreneurship Competition · Cloud–Edge–Device TPU Systems for Embodied AI
      date: Feb 2026 — Aug 2026
      tags: [SOPHON BM1684, TPU-MLIR, SAIL SDK, CV1800B / SG200x]
      bullets:
        - Supported participating teams with AI inference, model deployment, and development environments on BM1684 TPU platforms, Shaolin development boards, and Airbox microservers.
        - Helped troubleshoot TPU-MLIR compilation and quantization, SAIL SDK inference, distributed compute scheduling, hardware setup, and multi-stream video processing; compiled a competition FAQ.
        - Coordinated training and technical support with organizers and SOPHON engineers; received the Outstanding Challenge Technical Assistant award.
    - title: Student Leadership
      meta: School of Integrated Circuits, Jiangnan University
      date: 2023 — 2026
      bullets:
        - Head of the Integrated Circuit Design Club, Sep 2024 — Jun 2025.
        - Academic representative for Microelectronics Class 2201, Sep 2023 — Jun 2026.
