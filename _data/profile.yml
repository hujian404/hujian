zh:
  name: 胡健
  subtitle: 计算机体系结构 · 片上互连网络 · RISC-V 与 FPGA
  intro: 中国科学院计算技术研究所计算机技术专业硕士研究生，本科毕业于江南大学微电子科学与工程专业。关注 SIMT / GPU 体系结构、片上互连网络（NoC）及 FPGA 原型验证，也参与 AI 编译与软硬件协同研究。
  homepage: 个人主页
